[tool.poetry]
name = "text-to-sql-northwind-db"
version = "0.1.0"
description = "A tool that converts natural language queries into SQL queries for a Northwind database"
authors = ["Shamil <saeedshamil@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = ">=1.19.0,<2.0.0"
pandas = "^2.2.3"
sqlalchemy = "^2.0.40"
pyodbc = "^5.2.0"
python-dotenv = "^1.1.0"
openai = "0.28"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"